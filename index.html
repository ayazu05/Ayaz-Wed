<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayaz & Abida Wedding Invitation</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%;
            height: 100%;
            background: #0d0603;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-wrapper {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 900px;
            position: relative;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        .card-wrapper.unlocked {
            overflow-y: auto !important;
        }

        .card-wrapper::-webkit-scrollbar { width: 3px; }
        .card-wrapper::-webkit-scrollbar-thumb { background: #FFD700; border-radius: 10px; }

        /* STRICT BACKGROUND LOCK LAYER (Z-INDEX 1) */
        .bg-fixed-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-layer {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.8s ease-in-out;
        }

        .bg-layer video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        #bg-top { opacity: 1; z-index: 2; }
        #bg-bottom { opacity: 0; z-index: 1; }

        /* INITIAL OVERLAY SCREEN */
        .video-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1000;
            background: #0d0603;
            cursor: pointer;
            opacity: 1;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .video-overlay.fade-out {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }
